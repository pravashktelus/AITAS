name: BDD Playwright CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile to run'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - accessibility
          - mobile
          - cross-browser
      tags:
        description: 'Cucumber tags (e.g. @smoke, @regression)'
        required: false
        default: ''
      browser:
        description: 'Browser to use'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

env:
  NODE_VERSION: '20'

jobs:
  # ─── LINT & COMPILE CHECK ──────────────────────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  # ─── MAIN TEST EXECUTION ──────────────────────────────────────────
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Create reports directory
        run: mkdir -p reports/cucumber-json reports/allure-results

      - name: Verify application is reachable
        run: |
          echo "Checking if https://simulapp.online is reachable..."
          for i in 1 2 3 4 5; do
            if curl -sSf --max-time 30 https://simulapp.online/login > /dev/null 2>&1; then
              echo "✅ Application is reachable (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i failed, waiting 10s before retry..."
            sleep 10
          done
          echo "❌ Application is not reachable after 5 attempts"
          exit 1

      - name: Run BDD tests
        run: |
          PROFILE="${{ github.event.inputs.profile || 'default' }}"
          TAGS="${{ github.event.inputs.tags }}"
          BROWSER="${{ github.event.inputs.browser || 'chromium' }}"

          export CROSS_BROWSER_TARGET=$BROWSER

          if [ "$PROFILE" = "default" ] && [ -z "$TAGS" ]; then
            xvfb-run --auto-servernum -- npx cucumber-js
          elif [ -n "$TAGS" ]; then
            xvfb-run --auto-servernum -- npx cucumber-js --profile "$PROFILE" --tags "$TAGS"
          else
            xvfb-run --auto-servernum -- npx cucumber-js --profile "$PROFILE"
          fi
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          LAMBDATEST_USERNAME: ${{ secrets.LAMBDATEST_USERNAME }}
          LAMBDATEST_ACCESS_KEY: ${{ secrets.LAMBDATEST_ACCESS_KEY }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

      - name: Generate HTML report
        if: always()
        run: npm run report || true

      - name: Download previous Allure history
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-history

      - name: Generate Allure report with history
        if: always()
        run: |
          npx ts-node src/utils/GenerateAllureResults.ts
          LATEST_RUN=$(cat reports/allure-results/latest-run.txt 2>/dev/null || echo "")
          if [ -n "$LATEST_RUN" ] && [ -d "$LATEST_RUN" ]; then
            # First generate without history to get fresh results
            npx allure generate "$LATEST_RUN" --clean -o reports/allure-report

            # Now merge previous history INTO the generated report
            if [ -d "allure-history" ] && [ "$(ls -A allure-history 2>/dev/null)" ]; then
              echo "✅ Previous history found, merging..."
              mkdir -p reports/allure-report/history
              cp -r allure-history/* reports/allure-report/history/ 2>/dev/null || true
              echo "History merged. Contents:"
              ls -la reports/allure-report/history/
              # Re-generate with history in the source
              mkdir -p "$LATEST_RUN/history"
              cp -r allure-history/* "$LATEST_RUN/history/" 2>/dev/null || true
              npx allure generate "$LATEST_RUN" --clean -o reports/allure-report
              echo "Re-generated report with history"
            else
              echo "⚠️ No previous history (first run - this is normal)"
            fi

            # Verify history was created in output
            echo "=== Report history folder contents ==="
            ls -la reports/allure-report/history/ 2>/dev/null || echo "No history folder in report output"
          else
            echo "No allure results found, skipping"
          fi

      - name: Save Allure history for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: reports/allure-report/history/
          retention-days: 90
          overwrite: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            reports/cucumber-json/
            reports/html/
            reports/allure-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 30

  # ─── DEPLOY ALLURE TO GITHUB PAGES ────────────────────────────────
  deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Delete old Pages artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report
          overwrite: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
