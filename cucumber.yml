  formatOptions:
    snippetInterface: async-await
  parallel: 1

api:
  requireModule:
    - ts-node/register
  require:
    - src/core/CustomWorld.ts
    - src/hooks/Hooks.ts
    - src/steps/**/*.ts
  paths:
    - features/api/**/*.feature
  tags: "@api"
  format:
    - progress-bar
    - json:reports/cucumber-json/api-report.json
  formatOptions:
    snippetInterface: async-await
  parallel: 1
