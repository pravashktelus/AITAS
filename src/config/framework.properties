# ═══════════════════════════════════════════════════════════════════════════════
# Framework Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# All non-secret framework settings live here.
# Secrets/tokens go in .env (not committed to source control).

# ─── Environment ──────────────────────────────────────────────────────────────
env=qa
# browser is derived from the first entry in 'browsers' (cross-browser section)
headless=false
app.url=https://simulapp.online/login


# ─── API Configuration ────────────────────────────────────────────────────────
api.baseUrl=https://simulapp.online


app.maximizeBrowser=false

# ─── Timeouts (ms) ────────────────────────────────────────────────────────────
defaultTimeout=30000
navigationTimeout=60000
apiTimeout=15000
# Slow down each Playwright action by this many ms (useful for demos/debugging)
# 250 — slightly slower
# 500 — noticeable pause between actions (good for demos)
# 1000 — very slow, 1 second between each action
# 0 — full speed (default)
slowMo=500

# ─── Retry & Recovery ─────────────────────────────────────────────────────────
retryCount=2

# ─── Screenshots & Video ──────────────────────────────────────────────────────
screenshotOnFail=true
video=retain-on-failure

# ─── Self-Healing ─────────────────────────────────────────────────────────────
# Toggle self-healing on/off. When disabled, locator failures throw immediately.
#selfHealing.enabled=true
selfHealing.enabled=true
# Timeout (ms) for the initial locator attempt before triggering self-healing
selfHealing.locatorTimeout=5000
# Maximum number of fallback candidates to try
selfHealing.maxCandidates=10
# Whether to use OpenAI for healing suggestions (requires OPENAI_API_KEY in .env)
selfHealing.useOpenAI=true

# ─── Reporting ────────────────────────────────────────────────────────────────
# Attach self-healing HTML report to Allure/Cucumber on each healed step
selfHealing.attachReport=true
# ─── Test User Credentials ────────────────────────────────────────────────────
# Each test run will create a new account with generated email + configured password
test.user.password=TestUser@123
test.user.name=Test User
# Email domain for test accounts (will be: test-{timestamp}@{domain})
test.user.emailDomain=teleconnect.local

# ─── Mobile Configuration ─────────────────────────────────────────────────────
mobile.defaultDevice=iPhone 14
mobile.defaultOrientation=portrait
mobile.networkCondition=
# Execution mode determines HOW mobile tests run:
#   emulation  — Playwright device emulation in desktop browser (DEFAULT, no setup needed)
#   simulator  — Local iOS Simulator / Android Emulator via Appium
#   device     — Real physical device connected via USB + Appium
#   cloud      — Cloud device farm (BrowserStack, LambdaTest, Sauce Labs)
mobile.executionMode=emulation
# Cloud provider (only used when executionMode=cloud):
#   browserstack | lambdatest | saucelabs
mobile.cloudProvider=

# ─── Accessibility Configuration ──────────────────────────────────────────────
accessibility.enabled=true
accessibility.failOnCritical=true
accessibility.wcagLevel=AA
accessibility.maxViolations=0

# ─── Lighthouse Integration (Google Lighthouse via CDP) ───────────────────────
# Lighthouse provides axe-core based accessibility audit (80+ rules) + performance/SEO scores.
# Only works with Chromium. Enable alongside AccessibilityEngine for comprehensive coverage.
lighthouse.enabled=false
lighthouse.port=9222

# ─── Cross-Browser Configuration ─────────────────────────────────────────────
browsers=chromium,firefox
crossBrowser.parallel=true
crossBrowser.maxParallel=3

# ─── Browser-Specific Overrides ───────────────────────────────────────────────
browser.chromium.args=--no-sandbox,--disable-setuid-sandbox
browser.chromium.viewport=1280x720
browser.chromium.headless=false

browser.firefox.args=
browser.firefox.viewport=1280x720
browser.firefox.headless=false

browser.webkit.args=
browser.webkit.viewport=1280x720
browser.webkit.headless=false

# ─── Real Device Testing ──────────────────────────────────────────────────────
# Enable real device testing (overrides emulation when true)
realDevice.enabled=false
# Provider: local (Appium), browserstack, lambdatest
realDevice.provider=browserstack
# Platform: ios, android
realDevice.platform=android
# Device name (e.g., iPhone 15, Samsung Galaxy S24, Pixel 8)
realDevice.deviceName=Samsung Galaxy S24
# OS version (e.g., 17, 14)
realDevice.osVersion=14
# Browser: safari (iOS), chrome (Android)
realDevice.browser=chrome
# Appium server URL (local mode only)
realDevice.appiumServer=http://localhost:4723

# ─── Native App Testing ───────────────────────────────────────────────────────
# Enable native app testing (requires Appium server running)
nativeApp.enabled=true
# Appium server URL — switch between providers:
#   Local:        http://localhost:4723
#   BrowserStack: https://hub-cloud.browserstack.com/wd/hub
#   LambdaTest:   https://mobile-hub.lambdatest.com/wd/hub
nativeApp.appiumServer=http://localhost:4723
# Platform: android or ios
nativeApp.platform=android
# App path: local file path OR BrowserStack app URL
# Local:    ./testdata/appFiles/demo.apk (relative) or absolute path
# BrowserStack: bs://a31cede05f9d9bafcd6aae57dec442e8d368eb96
nativeApp.appPath=./testdata/appFiles/demo.apk
# App package (Android) — required for local Appium
nativeApp.appPackage=com.swaglabsmobileapp
nativeApp.appActivity=com.swaglabsmobileapp.SplashActivity
nativeApp.bundleId=
# Auto-grant permissions (Android)
nativeApp.autoGrantPermissions=true
# Reset app between scenarios
nativeApp.fullReset=false
nativeApp.noReset=true
