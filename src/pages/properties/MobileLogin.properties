# ═══════════════════════════════════════════════════════════════════════════════
# MobileLogin.properties — Mobile-Specific Locators for Login Page
# ═══════════════════════════════════════════════════════════════════════════════
#
# WHEN TO USE THIS FILE:
# Use 'MobileLogin.ElementKey' in scenarios tagged with @mobile or @device:*
# These locators target elements that appear ONLY on mobile viewports
# (responsive elements, hamburger menus, mobile-specific buttons)
#
# HOW LOCATORS WORK ON REAL DEVICES:
# ─────────────────────────────────────────────────────────────────────────────
# Whether you're on a real iPhone, real Android, or emulated device,
# the locators are STANDARD WEB LOCATORS (XPath, CSS, text=, etc.)
# because Playwright connects to the device's MOBILE BROWSER:
#   • iOS  → Safari browser (same DOM as desktop Safari, mobile viewport)
#   • Android → Chrome browser (same DOM as desktop Chrome, mobile viewport)
#
# The difference from desktop is:
#   1. Responsive CSS shows/hides different elements at mobile breakpoints
#   2. Some apps render mobile-specific components (hamburger, bottom nav)
#   3. Touch targets should be ≥ 44x44px
#
# LOCATOR STRATEGY (same for all platforms):
# ─────────────────────────────────────────────────────────────────────────────
#   XPath:        //button[@data-testid='submit']
#   CSS:          #email, .btn-primary, [data-testid='submit']
#   Text:         text=Sign In
#   Placeholder:  placeholder=Enter email
#   Role:         role=button[name='Submit']
#   Chained:      .mobile-nav >> .menu-item
#
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Mobile Header & Navigation ───────────────────────────────────────────────
# These elements appear ONLY at viewport ≤ 768px (mobile breakpoint)
HamburgerMenu=//button[@data-testid='mobile-menu-toggle']
MobileNavDrawer=//div[@data-testid='mobile-nav-drawer']
MobileNavClose=//button[@data-testid='mobile-nav-close']
MobileLogo=//img[@data-testid='mobile-logo']

# ─── Login Form (same form, mobile-responsive layout) ─────────────────────────
# On mobile, inputs are full-width and stacked vertically
InputEmail=//input[@data-testid='login-email']
InputPassword=//input[@data-testid='login-password']
BtnLogin=//button[@data-testid='login-submit']
LinkForgotPassword=//a[@data-testid='forgot-password-link']
LinkRegister=//a[@data-testid='register-link']

# ─── Mobile-Only Elements ──────────────────────────────────────────────────────
# Biometric login button (shows on mobile devices that support Face ID/fingerprint)
BtnBiometricLogin=//button[@data-testid='biometric-login']
# "Continue with App" deeplink button (mobile only)
BtnOpenInApp=//a[@data-testid='open-in-app']
# Mobile cookie consent banner (different from desktop version)
MobileCookieBanner=//div[@data-testid='mobile-cookie-banner']
BtnAcceptCookies=//button[@data-testid='accept-cookies-mobile']

# ─── Error Messages ───────────────────────────────────────────────────────────
ErrorInvalidEmail=//span[@data-testid='error-email']
ErrorInvalidPassword=//span[@data-testid='error-password']
ErrorLoginFailed=//div[@data-testid='error-login-failed']
# Mobile-specific toast notification (slides up from bottom)
ToastNotification=//div[@data-testid='toast-notification']

# ─── Bottom Navigation (mobile-only) ──────────────────────────────────────────
BottomNav=//nav[@data-testid='bottom-navigation']
BottomNavHome=//a[@data-testid='nav-home']
BottomNavSupport=//a[@data-testid='nav-support']
BottomNavAccount=//a[@data-testid='nav-account']

# ─── Social Login (same on all platforms) ──────────────────────────────────────
BtnGoogleLogin=//button[@data-testid='google-login']
BtnAppleLogin=//button[@data-testid='apple-login']
