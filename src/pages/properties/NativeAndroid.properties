# ═══════════════════════════════════════════════════════════════════════════════
# NativeAndroid.properties — Native Android App Locators (SauceLabs Demo App)
# ═══════════════════════════════════════════════════════════════════════════════
# 
# App: SauceLabs Demo App (SwagLabs Mobile) v2.7.1
# Package: com.swaglabsmobileapp
# Activity: com.swaglabsmobileapp.SplashActivity
#
# LOCATOR STRATEGIES FOR NATIVE ANDROID APPS:
# ─────────────────────────────────────────────────────────────────────────────
# id:              Android resource-id (e.g., id:com.myapp:id/login_button)
# accessibilityId: content-description attribute (cross-platform, RECOMMENDED)
# xpath:           XPath on the native view hierarchy XML
# class:           Android widget class (e.g., class:android.widget.Button)
# uiautomator:     UiAutomator2 selector (powerful Android-specific)
# name:            Element text/label
#
# DEFAULT (no prefix): treated as accessibilityId (most portable)
#
# FINDING LOCATORS:
# Use Appium Inspector (https://inspector.appiumpro.com) to inspect the app
# or: adb shell uiautomator dump /dev/tty  (Android UI hierarchy)
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Login Screen ──────────────────────────────────────────────────────────────
InputUsername=accessibilityId:test-Username
InputPassword=accessibilityId:test-Password
BtnLogin=accessibilityId:test-LOGIN
ErrorMessage=accessibilityId:test-Error message

# Alternative locators using XPath
InputUsernameXpath=xpath://android.widget.EditText[@content-desc='test-Username']
InputPasswordXpath=xpath://android.widget.EditText[@content-desc='test-Password']
BtnLoginXpath=xpath://android.view.ViewGroup[@content-desc='test-LOGIN']

# ─── Products Screen (after login) ────────────────────────────────────────────
ProductsTitle=xpath://android.widget.TextView[@text='PRODUCTS']
ProductsList=xpath://android.view.ViewGroup[@content-desc='test-Cart drop zone']
CartBadge=accessibilityId:test-Cart
CartIcon=accessibilityId:test-Cart

# Individual product items
FirstProduct=xpath:(//android.view.ViewGroup[@content-desc='test-Item'])[1]
FirstProductTitle=xpath:(//android.widget.TextView[@content-desc='test-Item title'])[1]
FirstProductPrice=xpath:(//android.widget.TextView[@content-desc='test-Price'])[1]
BtnAddToCart=xpath:(//android.view.ViewGroup[@content-desc='test-ADD TO CART'])[1]

# ─── Product Sort / Filter ────────────────────────────────────────────────────
BtnFilter=accessibilityId:test-Modal Selector Button
SortNameAsc=uiautomator:new UiSelector().text("Name (A to Z)")
SortNameDesc=uiautomator:new UiSelector().text("Name (Z to A)")
SortPriceLow=uiautomator:new UiSelector().text("Price (low to high)")
SortPriceHigh=uiautomator:new UiSelector().text("Price (high to low)")

# ─── Hamburger Menu ───────────────────────────────────────────────────────────
BtnMenu=accessibilityId:test-Menu
MenuAllItems=accessibilityId:test-ALL ITEMS
MenuWebView=accessibilityId:test-WEBVIEW
MenuAbout=accessibilityId:test-ABOUT
MenuLogout=accessibilityId:test-LOGOUT
MenuReset=accessibilityId:test-RESET APP STATE
BtnMenuClose=accessibilityId:test-Close

# ─── Cart Screen ──────────────────────────────────────────────────────────────
CartList=xpath://android.view.ViewGroup[@content-desc='test-Cart Content']
BtnContinueShopping=accessibilityId:test-CONTINUE SHOPPING
BtnCheckout=accessibilityId:test-CHECKOUT
CartItem=xpath://android.view.ViewGroup[@content-desc='test-Item']
CartItemTitle=xpath://android.widget.TextView[@content-desc='test-Description']
BtnRemoveFromCart=accessibilityId:test-REMOVE

# ─── Checkout Screen ──────────────────────────────────────────────────────────
InputFirstName=accessibilityId:test-First Name
InputLastName=accessibilityId:test-Last Name
InputPostalCode=accessibilityId:test-Zip/Postal Code
BtnContinue=accessibilityId:test-CONTINUE
BtnCancel=accessibilityId:test-CANCEL
BtnFinish=accessibilityId:test-FINISH
CheckoutError=accessibilityId:test-Error message

# ─── Checkout Complete ─────────────────────────────────────────────────────────
CheckoutComplete=accessibilityId:test-CHECKOUT: COMPLETE!
BtnBackHome=accessibilityId:test-BACK HOME
ThankYouHeader=xpath://android.widget.TextView[@text='THANK YOU FOR YOU ORDER']

# ─── Notifications / Permissions ───────────────────────────────────────────────
NotificationPermissionDialog=id:com.android.permissioncontroller:id/permission_message
BtnAllowNotification=id:com.android.permissioncontroller:id/permission_allow_button
BtnDenyNotification=id:com.android.permissioncontroller:id/permission_deny_button
