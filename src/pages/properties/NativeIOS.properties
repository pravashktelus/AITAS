# ═══════════════════════════════════════════════════════════════════════════════
# NativeIOS.properties — Native iOS App Locators (SauceLabs Demo App)
# ═══════════════════════════════════════════════════════════════════════════════
# 
# App: SauceLabs Demo App (SwagLabs Mobile) v2.7.1
# Bundle ID: com.saucelabs.SwagLabsMobileApp
#
# LOCATOR STRATEGIES FOR NATIVE iOS APPS:
# ─────────────────────────────────────────────────────────────────────────────
# accessibilityId: accessibilityIdentifier (cross-platform, RECOMMENDED)
# id:              Same as accessibilityId on iOS
# xpath:           XPath on the native element tree
# class:           UIKit class name (e.g., XCUIElementTypeButton)
# predicate:       iOS NSPredicate string (-ios predicate string)
# classChain:      iOS class chain query (-ios class chain)
# name:            Element name/label attribute
#
# DEFAULT (no prefix): treated as accessibilityId (most portable)
#
# FINDING LOCATORS:
# Use Appium Inspector or Xcode Accessibility Inspector
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Login Screen ──────────────────────────────────────────────────────────────
InputUsername=accessibilityId:test-Username
InputPassword=accessibilityId:test-Password
BtnLogin=accessibilityId:test-LOGIN
ErrorMessage=accessibilityId:test-Error message

# Alternative locators using iOS predicate
InputUsernamePredicate=predicate:name == 'test-Username'
InputPasswordPredicate=predicate:name == 'test-Password'

# ─── Products Screen (after login) ────────────────────────────────────────────
ProductsTitle=accessibilityId:test-Cart drop zone
ProductsList=accessibilityId:test-PRODUCTS
CartBadge=accessibilityId:test-Cart
CartIcon=accessibilityId:test-Cart

# Individual product items
FirstProduct=xpath:(//XCUIElementTypeOther[@name='test-Item'])[1]
FirstProductTitle=xpath:(//XCUIElementTypeStaticText[@name='test-Item title'])[1]
FirstProductPrice=xpath:(//XCUIElementTypeStaticText[@name='test-Price'])[1]
BtnAddToCart=xpath:(//XCUIElementTypeOther[@name='test-ADD TO CART'])[1]

# ─── Product Sort / Filter ────────────────────────────────────────────────────
BtnFilter=accessibilityId:test-Modal Selector Button
SortNameAsc=predicate:label == 'Name (A to Z)'
SortNameDesc=predicate:label == 'Name (Z to A)'
SortPriceLow=predicate:label == 'Price (low to high)'
SortPriceHigh=predicate:label == 'Price (high to low)'

# ─── Hamburger Menu ───────────────────────────────────────────────────────────
BtnMenu=accessibilityId:test-Menu
MenuAllItems=accessibilityId:test-ALL ITEMS
MenuWebView=accessibilityId:test-WEBVIEW
MenuAbout=accessibilityId:test-ABOUT
MenuLogout=accessibilityId:test-LOGOUT
MenuReset=accessibilityId:test-RESET APP STATE
BtnMenuClose=accessibilityId:test-Close

# ─── Cart Screen ──────────────────────────────────────────────────────────────
CartList=accessibilityId:test-Cart Content
BtnContinueShopping=accessibilityId:test-CONTINUE SHOPPING
BtnCheckout=accessibilityId:test-CHECKOUT
CartItem=xpath://XCUIElementTypeOther[@name='test-Item']
BtnRemoveFromCart=accessibilityId:test-REMOVE

# ─── Checkout Screen ──────────────────────────────────────────────────────────
InputFirstName=accessibilityId:test-First Name
InputLastName=accessibilityId:test-Last Name
InputPostalCode=accessibilityId:test-Zip/Postal Code
BtnContinue=accessibilityId:test-CONTINUE
BtnCancel=accessibilityId:test-CANCEL
BtnFinish=accessibilityId:test-FINISH
CheckoutError=accessibilityId:test-Error message

# ─── Checkout Complete ─────────────────────────────────────────────────────────
CheckoutComplete=accessibilityId:test-CHECKOUT: COMPLETE!
BtnBackHome=accessibilityId:test-BACK HOME
ThankYouHeader=predicate:label == 'THANK YOU FOR YOU ORDER'
