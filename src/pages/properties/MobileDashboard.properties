# ═══════════════════════════════════════════════════════════════════════════════
# MobileDashboard.properties — Mobile-Specific Locators for Dashboard
# ═══════════════════════════════════════════════════════════════════════════════
#
# WHEN TO USE THIS FILE:
# Use 'MobileDashboard.ElementKey' in scenarios tagged with @mobile or @device:*
# These locators target mobile-responsive dashboard elements
#
# ═══════════════════════════════════════════════════════════════════════════════
# LOCATOR REFERENCE FOR MOBILE WEB (iOS Safari + Android Chrome)
# ═══════════════════════════════════════════════════════════════════════════════
#
# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Platform      │ Browser      │ Locator Type   │ How It Works              │
# ├────────────────────────────────────────────────────────────────────────────┤
# │ iOS (real)    │ Safari       │ Same as web    │ Playwright → Safari CDP   │
# │ iOS (emu)     │ WebKit       │ Same as web    │ Playwright WebKit engine  │
# │ Android (real)│ Chrome       │ Same as web    │ Playwright → Chrome CDP   │
# │ Android (emu) │ Chromium     │ Same as web    │ Playwright Chromium       │
# └────────────────────────────────────────────────────────────────────────────┘
#
# KEY POINT: Locators are IDENTICAL across all platforms because you're
# testing a WEBSITE in a mobile browser — not a native app.
#
# TIPS FOR MOBILE LOCATORS:
# ─────────────────────────────────────────────────────────────────────────────
# 1. Use data-testid attributes (most reliable across all viewports)
# 2. Use role= locators for accessible interactive elements
# 3. Avoid position-based XPath (//div[3]) — layouts shift on mobile
# 4. Check viewport-conditional elements:
#    - Some elements are hidden (display:none) on mobile
#    - Some elements ONLY appear on mobile (hamburger, bottom nav)
# 5. Touch targets should be ≥ 44x44px for accessibility compliance
#
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Mobile Header ─────────────────────────────────────────────────────────────
HamburgerMenu=//button[@data-testid='hamburger-menu']
HeaderLogo=//img[@data-testid='header-logo-mobile']
NotificationBell=//button[@data-testid='notification-bell']
NotificationBadge=//span[@data-testid='notification-count']

# ─── Mobile Navigation Drawer ──────────────────────────────────────────────────
# Slides in from left when hamburger is tapped
NavDrawer=//aside[@data-testid='nav-drawer']
NavDrawerOverlay=//div[@data-testid='drawer-overlay']
NavItemDashboard=//a[@data-testid='nav-dashboard']
NavItemOrders=//a[@data-testid='nav-orders']
NavItemProfile=//a[@data-testid='nav-profile']
NavItemSettings=//a[@data-testid='nav-settings']
NavItemLogout=//a[@data-testid='nav-logout']

# ─── Dashboard Content (mobile layout) ────────────────────────────────────────
# On mobile, cards stack vertically instead of grid
WelcomeHeading=//h1[@data-testid='welcome-heading']
WelcomeSubtext=//p[@data-testid='welcome-subtext']

# Stat cards — same data, vertical stacked on mobile
StatCardOrders=//div[@data-testid='stat-orders']
StatCardActive=//div[@data-testid='stat-active']
StatCardPending=//div[@data-testid='stat-pending']

# ─── Order List (mobile view) ──────────────────────────────────────────────────
# Mobile uses a simplified card layout instead of table
OrderListSection=//section[@data-testid='order-list']
FirstOrderCard=//div[@data-testid='order-card-0']
OrderCardStatus=//span[@data-testid='order-status-badge']
OrderCardNumber=//span[@data-testid='order-number']
OrderCardDate=//span[@data-testid='order-date']
BtnViewOrder=//button[@data-testid='btn-view-order']

# ─── Pull-to-Refresh (mobile gesture element) ─────────────────────────────────
PullToRefreshIndicator=//div[@data-testid='pull-refresh-indicator']

# ─── Floating Action Button (mobile-only) ─────────────────────────────────────
FabNewOrder=//button[@data-testid='fab-new-order']

# ─── Bottom Tab Bar (mobile-only navigation) ──────────────────────────────────
BottomTabBar=//nav[@data-testid='bottom-tab-bar']
TabHome=//a[@data-testid='tab-home']
TabOrders=//a[@data-testid='tab-orders']
TabNewOrder=//a[@data-testid='tab-new-order']
TabNotifications=//a[@data-testid='tab-notifications']
TabProfile=//a[@data-testid='tab-profile']

# ─── Mobile Search ─────────────────────────────────────────────────────────────
# Search is in a collapsible header on mobile
BtnSearchToggle=//button[@data-testid='search-toggle']
InputSearch=//input[@data-testid='search-input']
BtnSearchSubmit=//button[@data-testid='search-submit']
SearchResults=//div[@data-testid='search-results']
NoResultsMessage=//p[@data-testid='no-results']

# ─── Swipe Actions (mobile-specific interactions) ──────────────────────────────
# Swipe-left on order card reveals action buttons
SwipeActionDelete=//button[@data-testid='swipe-action-delete']
SwipeActionArchive=//button[@data-testid='swipe-action-archive']

# ─── Mobile Dialogs / Bottom Sheets ───────────────────────────────────────────
# Mobile uses bottom sheets instead of centered modals
BottomSheet=//div[@data-testid='bottom-sheet']
BottomSheetTitle=//h3[@data-testid='bottom-sheet-title']
BtnBottomSheetClose=//button[@data-testid='bottom-sheet-close']
BtnBottomSheetConfirm=//button[@data-testid='bottom-sheet-confirm']
